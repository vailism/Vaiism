name: Watch Together Keepalive

on:
  schedule:
    # Runs every 5 minutes to keep the Render free-tier container warm
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggers from the GitHub Actions dashboard

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Check
        run: |
          echo "Sending keepalive request to Render backend..."
          RESPONSE_CODE=$(curl -s -w "%{http_code}" -o response.json "https://vailism-sync.onrender.com/health")
          
          echo "HTTP Status Code: $RESPONSE_CODE"
          echo "Response Content:"
          cat response.json
          echo "" # New line for cleaner log spacing
          
          if [ "$RESPONSE_CODE" -ne 200 ]; then
            echo "Error: Health check endpoint returned status code $RESPONSE_CODE"
            exit 1
          fi
          
          echo "Keepalive check successful! Render server is active."
