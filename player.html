<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VAILISM - Player</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
        }

        .top-controls {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .back-button {
            color: white;
            font-size: 16px;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: 500;
            font-family: 'Outfit', 'Arial', sans-serif;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .back-button:hover {
            transform: scale(1.05);
            background: #e50914;
            border-color: #e50914;
        }

        /* ── Audio/Language dropdown ─────────────────────────────────── */
        .audio-wrapper {
            position: relative;
        }

        .audio-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.75);
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            padding: 9px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Outfit', 'Arial', sans-serif;
            transition: background 0.2s, border-color 0.2s;
            white-space: nowrap;
        }

        .audio-btn:hover {
            background: rgba(229,9,20,0.25);
            border-color: #e50914;
        }

        .audio-btn svg { flex-shrink: 0; }

        .audio-btn .caret {
            transition: transform 0.2s;
            margin-left: 4px;
        }

        .audio-btn.open .caret { transform: rotate(180deg); }

        .audio-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: rgba(18,18,18,0.97);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            overflow: hidden;
            min-width: 190px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 200;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }

        .audio-dropdown.open { display: block; animation: dropIn 0.15s ease; }

        @keyframes dropIn {
            from { opacity:0; transform: translateY(-6px); }
            to   { opacity:1; transform: translateY(0); }
        }

        .dropdown-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            padding: 10px 14px 6px;
            font-family: 'Outfit', 'Arial', sans-serif;
        }

        .audio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.8);
            padding: 10px 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            font-family: 'Outfit', 'Arial', sans-serif;
            text-align: left;
            transition: background 0.15s, color 0.15s;
        }

        .audio-option:hover {
            background: rgba(255,255,255,0.07);
            color: #fff;
        }

        .audio-option.active {
            color: #e50914;
            font-weight: 700;
        }

        .audio-option .lang-flag {
            font-size: 18px;
            line-height: 1;
        }

        .audio-option .lang-info { display: flex; flex-direction: column; gap: 1px; }
        .audio-option .lang-name { font-size: 13px; font-weight: 600; }
        .audio-option .lang-sub  { font-size: 10px; color: rgba(255,255,255,0.4); font-weight: 400; }
        .audio-option.active .lang-sub { color: rgba(229,9,20,0.7); }

        .player-wrap {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .player-wrap iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
        }

        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #e50914;
            z-index: 50;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(229, 9, 20, 0.3);
            border-top: 4px solid #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            color: rgba(255,255,255,0.6);
            font-family: 'Outfit', 'Arial', sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="top-controls">
        <a href="index.html" class="back-button">← Back to Browse</a>

        <div class="audio-wrapper" id="audioWrapper">
            <button class="audio-btn" id="audioBtn" onclick="toggleAudioMenu()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="2" y1="12" x2="22" y2="12"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
                <span id="audioBtnLabel">English</span>
                <svg class="caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="audio-dropdown" id="audioDropdown">
                <div class="dropdown-label">Select Audio / Source</div>
                <button class="audio-option active" id="opt-vidlink" onclick="selectServer('vidlink','English', this)">
                    <span class="lang-flag">🇬🇧</span>
                    <span class="lang-info">
                        <span class="lang-name">English</span>
                        <span class="lang-sub">Default · VidLink</span>
                    </span>
                </button>
                <button class="audio-option" id="opt-vidsrc" onclick="selectServer('vidsrc','Hindi / Multi', this)">
                    <span class="lang-flag">🇮🇳</span>
                    <span class="lang-info">
                        <span class="lang-name">Hindi / Multi</span>
                        <span class="lang-sub">Dub · 2Embed</span>
                    </span>
                </button>
                <button class="audio-option" id="opt-super" onclick="selectServer('super','Subtitles', this)">
                    <span class="lang-flag">💬</span>
                    <span class="lang-info">
                        <span class="lang-name">Subtitles / Alt</span>
                        <span class="lang-sub">Multi-lang · VidSrc XYZ</span>
                    </span>
                </button>
            </div>
        </div>
    </div>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <span class="loader-text">Loading...</span>
    </div>

    <div class="player-wrap" id="player-wrap" style="opacity:0; transition: opacity 0.4s ease;">
        <!-- Iframe injected via JS -->
    </div>

    <script>
    (function () {
        'use strict';

        // ── Parse URL params ──────────────────────────────────────────────
        var params    = new URLSearchParams(window.location.search);
        var movieId   = params.get('id');
        var mediaType = params.get('type') || 'movie';

        var loader     = document.getElementById('loader');
        var playerWrap = document.getElementById('player-wrap');

        // ── Storage key ──────────────────────────────────────────────────
        var storageKey = 'vailism_progress_' + movieId;

        // ── Guard: invalid ID ─────────────────────────────────────────────
        if (!movieId || movieId === 'undefined' || movieId === 'null') {
            console.error('[VAILISM] Invalid ID provided:', movieId);
            // Cleanup storage if we have a key but the ID itself is bad
            if (movieId) {
                try { localStorage.removeItem(storageKey); } catch (e) {}
            }
            
            document.body.innerHTML =
                '<div style="color:#fff;text-align:center;padding:60px 20px;">' +
                '<h1 style="margin-bottom:20px;">Invalid Content ID</h1>' +
                '<p style="color:#999;margin-bottom:20px;">The requested content could not be loaded.</p>' +
                '<a href="index.html" style="color:#e50914;font-size:18px;">← Return Home</a>' +
                '</div>';
            return;
        }

        // ── Load saved progress ───────────────────────────────────────────
        var savedData = null;
        try {
            savedData = JSON.parse(localStorage.getItem(storageKey) || 'null');
        } catch (e) {
            savedData = null;
        }

        // ── Validate saved data ───────────────────────────────────────────
        if (savedData) {
            var st = parseFloat(savedData.timestamp);
            var sd = parseFloat(savedData.duration);
            if (!isFinite(st) || !isFinite(sd) || st <= 0 || st >= sd) {
                savedData = null;
            }
        }

        // ── Pre-flight check: Ensure ID exists for this mediaType ────────────────
        async function initPlayer() {
            try {
                var checkPath = '/' + mediaType + '/' + movieId;
                var res = await fetch('/api/tmdb?path=' + encodeURIComponent(checkPath));
                
                if (!res.ok) {
                    if (res.status === 404) {
                        console.error('[VAILISM] API 404: Content not found. Cleaning up.');
                        try { localStorage.removeItem(storageKey); } catch (e) {}
                        throw new Error('Content not found (404)');
                    }
                    // For other errors (rate limits, etc.), try loading anyway
                }

                buildIframe();
            } catch (err) {
                console.error('[VAILISM] Init failed:', err);
                document.body.innerHTML =
                    '<div style="color:#fff;text-align:center;padding:60px 20px;">' +
                    '<h1 style="margin-bottom:20px;">Media Unavailable</h1>' +
                    '<p style="color:#999;margin-bottom:20px;">' + err.message + '</p>' +
                    '<a href="index.html" style="color:#e50914;font-size:18px;">← Return Home</a>' +
                    '</div>';
            }
        }

        function getEmbedUrl(server, movieId, s, e, ts) {
            var startTimeParam = '';
            if (ts > 0) {
                // Not all servers support startTime natively, but we apply it where possible
                startTimeParam = '&startTime=' + Math.floor(ts) + '&t=' + Math.floor(ts);
            }

            if (mediaType === 'tv') {
                if (server === 'vidlink') return 'https://vidlink.pro/tv/' + movieId + '/' + s + '/' + e + '?primaryColor=e50914&autoplay=true' + startTimeParam;
                if (server === 'vidsrc')  return 'https://www.2embed.skin/embedtv/' + movieId + '&s=' + s + '&e=' + e;
                if (server === 'super')   return 'https://vidsrc.xyz/embed/tv?tmdb=' + movieId + '&season=' + s + '&episode=' + e;
            } else {
                if (server === 'vidlink') return 'https://vidlink.pro/movie/' + movieId + '?primaryColor=e50914&autoplay=true' + startTimeParam;
                if (server === 'vidsrc')  return 'https://www.2embed.skin/embed/' + movieId;
                if (server === 'super')   return 'https://vidsrc.xyz/embed/movie?tmdb=' + movieId;
            }
            return '';
        }

        var currentServer = 'vidlink';
        var currentIframe = null;

        function buildIframe() {
            // Refresh savedData to capture any progress made on previous server
            try {
                var freshData = JSON.parse(localStorage.getItem(storageKey) || 'null');
                if (freshData) savedData = freshData;
            } catch (e) {}

            var ts = 0;
            if (savedData && savedData.timestamp && savedData.duration) {
                var rawTs = parseFloat(savedData.timestamp);
                var dur = parseFloat(savedData.duration);
                if (rawTs > 0 && dur > 0 && rawTs < (dur - 10)) {
                    ts = Math.min(rawTs, dur - 5);
                }
            }
            
            var s = 1, e = 1;
            if (mediaType === 'tv') {
                s = params.get('s') || (savedData && savedData.season) || 1;
                e = params.get('e') || (savedData && savedData.episode) || 1;
            }

            var embedUrl = getEmbedUrl(currentServer, movieId, s, e, ts);
            console.log('[VAILISM] Player URL:', embedUrl);

            playerWrap.innerHTML = ''; // Clear existing
            loader.style.display = 'flex';
            playerWrap.style.opacity = '0';

            currentIframe = document.createElement('iframe');
            currentIframe.src = embedUrl;
            currentIframe.setAttribute('frameborder', '0');
            currentIframe.setAttribute('scrolling', 'no');
            currentIframe.setAttribute('allowfullscreen', 'true');
            currentIframe.setAttribute('allow', 'autoplay; fullscreen; picture-in-picture');
            currentIframe.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');

            function onPlayerLoad() {
                loader.style.display = 'none';
                playerWrap.style.opacity = '1';
                console.log('[VAILISM] Player loaded. Establishing session...');
            }

            currentIframe.addEventListener('load', onPlayerLoad);
            setTimeout(onPlayerLoad, 8000); // fallback

            playerWrap.appendChild(currentIframe);
        }

        // ── Audio/Language dropdown ───────────────────────────────────────
        window.toggleAudioMenu = function() {
            var btn      = document.getElementById('audioBtn');
            var dropdown = document.getElementById('audioDropdown');
            btn.classList.toggle('open');
            dropdown.classList.toggle('open');
        };

        window.selectServer = function(serverName, label, optEl) {
            if (currentServer === serverName) {
                // Still close the dropdown
                document.getElementById('audioBtn').classList.remove('open');
                document.getElementById('audioDropdown').classList.remove('open');
                return;
            }
            currentServer = serverName;

            // Update button label
            document.getElementById('audioBtnLabel').textContent = label;

            // Update active state on options
            document.querySelectorAll('.audio-option').forEach(b => b.classList.remove('active'));
            optEl.classList.add('active');

            // Close dropdown
            document.getElementById('audioBtn').classList.remove('open');
            document.getElementById('audioDropdown').classList.remove('open');

            // Rebuild iframe with new server
            buildIframe();
        };

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            var wrapper = document.getElementById('audioWrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                document.getElementById('audioBtn').classList.remove('open');
                document.getElementById('audioDropdown').classList.remove('open');
            }
        });

        initPlayer();

        // ── Progress tracking via postMessage ─────────────────────────────
        // Vidking sends postMessages with player state. We intercept and save.
        var saveThrottle    = null;
        var lastLoggedTime  = -1;

        function onPlayerMessage(event) {
            var payload = event.data;
            if (!payload) return;

            try {
                if (typeof payload === 'string') payload = JSON.parse(payload);
            } catch (e) {
                return; // not JSON – ignore
            }

            if (!payload || typeof payload !== 'object') return;

            // Generic Iframe Player Event parser
            var data = null;
            if (payload.type === 'PLAYER_EVENT' && payload.data) {
                data = payload.data;
            } else {
                data = payload;
            }
            if (!data || typeof data !== 'object') return;

            var rawEvent = (data.event || data.type || '').toLowerCase();
            var evtName = rawEvent.includes('timeupdate') || rawEvent.includes('progress') ? 'timeupdate' : 
                          rawEvent.includes('pause') ? 'pause' : 
                          rawEvent.includes('ended') || rawEvent.includes('complete') ? 'ended' : rawEvent;

            var currentTime = parseFloat(data.currentTime !== undefined ? data.currentTime : (data.time !== undefined ? data.time : data.position)) || 0;
            var duration    = parseFloat(data.duration !== undefined ? data.duration : data.length) || 0;

            // Throttle debug logging to once every 30s to keep console clean
            if (evtName === 'timeupdate') {
                if (currentTime - lastLoggedTime >= 30) {
                    console.log('[VAILISM] time=' + currentTime.toFixed(0) + 's / ' + duration.toFixed(0) + 's');
                    lastLoggedTime = currentTime;
                }
            } else {
                console.log('[VAILISM][' + evtName + '] time=' + currentTime.toFixed(1));
            }

            // Save on timeupdate and pause
            if (evtName === 'timeupdate' || evtName === 'pause') {
                if (currentTime > 0 && duration > 0 && currentTime < duration) {
                    if (saveThrottle) return;
                    saveThrottle = setTimeout(function () { saveThrottle = null; }, 3000);

                    var toSave = {
                        id:        parseInt(movieId, 10),
                        mediaType: mediaType,
                        timestamp: Math.max(0, Math.min(currentTime, duration)),
                        duration:  duration,
                        updatedAt: Date.now()
                    };

                    if (mediaType === 'tv') {
                        // Use existing season/ep from current playback or fallback to saved/default
                        toSave.season  = parseInt(data.season  || (savedData ? savedData.season : 1), 10);
                        toSave.episode = parseInt(data.episode || (savedData ? savedData.episode : 1), 10);
                    }

                    try {
                        localStorage.setItem(storageKey, JSON.stringify(toSave));
                    } catch (e) {
                        console.warn('[VAILISM] localStorage write failed:', e);
                    }
                }
            }

            // Clear storage when video completes
            if (evtName === 'ended' || evtName === 'complete') {
                try { localStorage.removeItem(storageKey); } catch (e) {}
                console.log('[VAILISM] Playback complete – progress cleared.');
            }
        }

        window.addEventListener('message', onPlayerMessage);

        // ── Cleanup on page unload (prevents memory leaks / stacking on
        //    browsers that keep pages in bfcache) ────────────────────────
        function cleanup() {
            window.removeEventListener('message', onPlayerMessage);
            if (saveThrottle) {
                clearTimeout(saveThrottle);
                saveThrottle = null;
            }
        }
        window.addEventListener('pagehide',    cleanup);
        window.addEventListener('beforeunload', cleanup);

    })();
    </script>
</body>
</html>
