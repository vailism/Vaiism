<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VAILISM — Stream movies and TV shows instantly. A premium Netflix-style streaming experience.">
    <title>VAILISM — Stream Everything</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="VAILISM" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Critical CSS: Inlined for instant first paint -->
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
        body {
            background-color: #141414;
            color: #fff;
            font-family: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
        }
        .hidden { display: none !important; }
        .navbar {
            position: fixed; top: 0; width: 100%; padding: 35px 4%;
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
            z-index: 2000;
        }
        .logo {
            height: 40px;
            width: auto;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .logo:hover {
            transform: scale(1.08);
        }
        .hero {
            position: relative; height: 98vh;
            background-color: #141414; background-size: cover;
            background-position: center bottom; display: flex;
            align-items: center; padding: 0 10%; overflow: hidden;
        }
        .hero-vignette {
            position: absolute; inset: 0;
            background: linear-gradient(to right, rgba(10,10,10,1) 0%, rgba(10,10,10,0.85) 25%, transparent 60%),
                        linear-gradient(to top, rgba(10,10,10,1) 0%, rgba(10,10,10,0.7) 15%, transparent 40%);
            z-index: 2;
        }
        .hero-content { position: relative; z-index: 3; max-width: 850px; }
        .skeleton-text {
            background: linear-gradient(90deg, #2a2a2a 25%, #3a3a3a 50%, #2a2a2a 75%);
            background-size: 200% 100%; animation: loading 1.5s infinite;
            color: transparent !important; border-radius: 4px;
            min-height: 1.2em; min-width: 200px;
        }
        @keyframes loading { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    </style>

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://vidlink.pro">

    <!-- Full CSS: deferred to unblock first paint -->
    <link rel="stylesheet" href="style.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="style.css"></noscript>

    <!-- Single combined font request (saves 1 RTT) -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"></noscript>

    <!-- Lucide icons: deferred -->
    <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="nav-left">
            <img class="logo" src="logo.png" alt="VAILISM" onclick="window.location.reload()">
        </div>
        <div class="nav-right">
            <div class="search-container">
                <span class="search-icon"><i data-lucide="search"></i></span>
                <input type="text" id="search-input" placeholder="Titles, genres..." autocomplete="off">
            </div>
        </div>
    </nav>

    <!-- Search Overlay -->
    <div id="search-view" class="search-view hidden">
        <div class="search-wrapper">
            <h2>Search Results</h2>
            <div id="search-results" class="search-grid"></div>
        </div>
    </div>

    <!-- Main App Container (Hidden during search) -->
    <div id="app-content">
        <!-- Hero Section -->
        <header class="hero" id="hero">
            <div class="hero-vignette"></div>
            <div class="hero-content">
                <h1 class="hero-title skeleton-text" id="hero-title"></h1>
                <div class="hero-meta" id="hero-meta" style="opacity: 0;">
                    <span id="hero-rating" class="meta-rating"></span>
                    <span id="hero-year" class="meta-year"></span>
                    <span id="hero-runtime" class="meta-runtime"></span>
                </div>
                <div class="hero-genres" id="hero-genres"></div>
                <p class="hero-description skeleton-text" id="hero-desc"></p>
                <div class="hero-buttons">
                    <button class="btn btn-play" id="hero-play" style="display: none;">
                        <i data-lucide="play" fill="currentColor"></i> Play
                    </button>
                    <button class="btn btn-info" id="hero-info" style="display: none;">
                        <i data-lucide="info"></i> More Info
                    </button>
                </div>
            </div>
        </header>

        <!-- Rows Container -->
        <main class="main-content" id="main-content">
            <!-- Dynamically injected rows -->
        </main>
    </div>

    <!-- App logic: deferred to unblock rendering -->
    <script src="script.js" defer></script>
    <script>
      // Initialize Lucide icons once both DOM and script are ready
      window.addEventListener('load', function() {
          if (window.lucide) lucide.createIcons();
          if ('serviceWorker' in navigator) {
              navigator.serviceWorker.register('/sw.js').catch(err => console.error('[SW] Registration failed:', err));
          }
      });
    </script>
</body>
</html>
